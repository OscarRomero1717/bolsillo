<section class="dash">
  <div class="intro">
    <h2>Tus metas</h2>
    <p>Crea una meta y abona. El progreso se actualiza al instante.</p>
  </div>

  <app-create-goal-form />

  @if (loading()) {
    <p class="status-msg">Cargando metas…</p>
  }

  @if (error(); as message) {
    <p class="error">{{ message }}</p>
  }

  @if (!loading() && !error() && goals().length === 0) {
    <p class="empty">no hay metas</p>
  }

  <div class="grid">
    @for (goal of goals(); track goal.id) {
      <app-goal-card [goal]="goal" />
    }
  </div>
  <app-goal-completed-dialog />
</section>
